name: CI — Typecheck & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npx vitest run --pool forks --maxWorkers 1 --no-file-parallelism --reporter basic
